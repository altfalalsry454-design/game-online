<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة الألغاز المركزية</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .box { border: 2px solid #007bff; padding: 20px; display: inline-block; border-radius: 10px; }
        input, button { padding: 10px; margin: 10px; display: block; width: 250px; }
    </style>
</head>
<body>

    <div class="box" id="loginOverlay">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="usernameInput" placeholder="اسمك">
        <input type="password" id="userLoginPassword" placeholder="كلمة المرور">
        <button onclick="handleLoginRoute()">دخول</button>
    </div>

    <div class="box" style="display:none;" id="gameSection">
        <h2 id="currentStory">جاري التحميل...</h2>
        <p id="currentHint"></p>
        <input type="text" id="userPassword" placeholder="كلمة السر">
        <button onclick="checkPassword()">إرسال الإجابة</button>
        <div id="resultBox"></div>
    </div>

    <script>
        // ضع رابط السيرفر الخاص بك هنا بعد رفعه على Render
        const SERVER_URL = "https://your-server-name.onrender.com";

        let currentUser = "";

        async function callServer(endpoint, method = 'POST', data = {}) {
            const response = await fetch(`${SERVER_URL}${endpoint}`, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await response.json();
        }

        async function handleLoginRoute() {
            let name = document.getElementById('usernameInput').value;
            const res = await callServer('/login', 'POST', { name: name });
            if (res.success) {
                currentUser = name;
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('gameSection').style.display = "block";
                loadDataFromServer();
            }
        }

        async function checkPassword() {
            let userAns = document.getElementById('userPassword').value;
            const res = await callServer('/check-answer', 'POST', { username: currentUser, answer: userAns });
            document.getElementById('resultBox').innerText = res.message;
        }

        async function loadDataFromServer() {
            const res = await callServer('/get-game-data', 'GET');
            document.getElementById('currentStory').innerText = res.story;
            document.getElementById('currentHint').innerText = "التلميح: " + res.hint;
        }
    </script>
</body>
</html>
