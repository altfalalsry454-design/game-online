<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Zero</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        h2 { color: #00adb5; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        h3 { color: #ffc107; margin-bottom: 15px; }
        .card { background-color: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; background-color: #252525; border: 1px solid #333; border-radius: 6px; color: white; }
        .btn { background-color: #00adb5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-danger { background-color: #ff4444; }
        
        /* تصميم المودال الموحد */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #00adb5; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="modal" id="loginModal" style="display:flex;">
        <div class="modal-content">
            <h3>🔒 دخول الأدمن</h3>
            <input type="password" id="adminPass" placeholder="كلمة سر الأدمن">
            <button class="btn" style="margin-top:15px;" onclick="checkAdmin()">دخول</button>
        </div>
    </div>

    <div class="modal" id="msgModal">
        <div class="modal-content">
            <p id="msgText"></p>
            <button class="btn" style="margin-top:20px;" onclick="closeMsg()">حسناً</button>
        </div>
    </div>

    <h2>لوحة التحكم الشاملة</h2>
    <div class="card">
        <h3>📝 نشر القصة واللغز الحالي</h3>
        <div class="form-group"><input type="text" id="storyTitle" placeholder="العنوان"></div>
        <div class="form-group"><input type="text" id="storyAuthor" placeholder="الكاتب"></div>
        <div class="form-group"><textarea id="storyBody" placeholder="القصة..."></textarea></div>
        <div class="form-group"><input type="text" id="storyPassword" placeholder="كلمة السر"></div>
        <div class="form-group"><input type="text" id="storyHint" placeholder="التلميح"></div>
        <button class="btn" onclick="updatePuzzle()">نشر القصة 🚀</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCYnbAcV0HtrSyRUorBQmXQuBJO7m1C4A",
            authDomain: "zerobaba-7733e.firebaseapp.com",
            projectId: "zerobaba-7733e",
            storageBucket: "zerobaba-7733e.firebasestorage.app",
            messagingSenderId: "20311065718",
            appId: "1:20311065718:web:5e50f0ad492d57f2518b57"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function showMsg(txt, callback) {
            document.getElementById('msgText').innerText = txt;
            document.getElementById('msgModal').style.display = 'flex';
            window.tempCallback = callback;
        }
        function closeMsg() {
            document.getElementById('msgModal').style.display = 'none';
            if(window.tempCallback) window.tempCallback();
        }

        function checkAdmin() {
            if(document.getElementById('adminPass').value === "15935700") {
                document.getElementById('loginModal').style.display = 'none';
                localStorage.setItem("loggedInUser", "Zero");
                loadAdminData();
            } else {
                showMsg("كلمة سر خاطئة!", () => window.location.href = "index.html");
            }
        }

        function updatePuzzle() {
            db.collection("game").doc("current_puzzle").set({
                title: document.getElementById("storyTitle").value,
                author: document.getElementById("storyAuthor").value,
                story: document.getElementById("storyBody").value,
                password: document.getElementById("storyPassword").value,
                hint: document.getElementById("storyHint").value,
                isSolved: false
            }).then(() => showMsg("تم النشر بنجاح!"));
        }

        function loadAdminData() { /* ... الكود الخاص بك ... */ }
    </script>
</body>
</html>
