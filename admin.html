<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Zero</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        h2 { color: #00adb5; margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        h3 { color: #ffc107; margin-bottom: 15px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
        .card { background-color: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; background-color: #252525; border: 1px solid #333; border-radius: 6px; color: white; font-size: 16px; }
        textarea { height: 120px; resize: none; }
        .btn { background-color: #00adb5; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { background-color: #008c9e; }
        .btn-danger { background-color: #ff4444; }
        .btn-danger:hover { background-color: #cc0000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; font-size: 14px; }
        th { background-color: #252525; color: #00adb5; }
        .suggestion-item { background-color: #252525; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid #ffc107; }
        .table-input { width: 100%; max-width: 80px; text-align: center; background: #252525; color: #fff; border: 1px solid #333; border-radius: 4px; padding: 4px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <h2>مرحباً يا أدمن Zero - لوحة التحكم الشاملة</h2>
    <div class="admin-grid">
        <div class="card">
            <h3>📝 نشر القصة واللغز الحالي</h3>
            <div class="form-group"><label>نوع العنوان (مثال: عنوان قصة اليوم)</label><input type="text" id="storyTitle" placeholder="اكتب العنوان هنا"></div>
            <div class="form-group"><label>اسم كاتب القصة</label><input type="text" id="storyAuthor" placeholder="مثال: النظام"></div>
            <div class="form-group"><label>نص القصة واللغز</label><textarea id="storyBody" placeholder="اكتب القصة واللغز هنا..."></textarea></div>
            <div class="form-group"><label>كلمة السر (الحل الصحيح)</label><input type="text" id="storyPassword" placeholder="كلمة السر المستهدفة"></div>
            <div class="form-group"><label>التلميح</label><input type="text" id="storyHint" placeholder="تلميح لمساعدة اللاعبين"></div>
            <button class="btn" onclick="updatePuzzle()">تحديث ونشر القصة فوراً 🚀</button>
        </div>
        <div>
            <div class="card">
                <h3>🔗 رابط تواصل الإدارة</h3>
                <div class="form-group"><label>رابط موقع التواصل</label><input type="text" id="contactUrl" placeholder="https://t.me/yourchannel"></div>
                <button class="btn" onclick="updateContact()">حفظ الرابط</button>
            </div>
            <div class="card">
                <h3>👥 إدارة الحسابات، النقاط، وكلمات المرور</h3>
                <div style="max-height: 350px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>اللاعب</th>
                                <th>النقاط</th>
                                <th>باسورد</th>
                                <th>تحكم</th>
                            </tr>
                        </thead>
                        <tbody id="adminUsersRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="card" style="margin-top: 20px;">
        <h3>📥 اقتراحات قصص الفائزين (أول من حل اللغز)</h3>
        <div id="suggestionsContainer"><p style="color: #888;">لا توجد اقتراحات جديدة حالياً.</p></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCYnbAcV0HtrSyRUorBQmXQuBJO7m1C4A",
            authDomain: "zerobaba-7733e.firebaseapp.com",
            projectId: "zerobaba-7733e",
            storageBucket: "zerobaba-7733e.firebasestorage.app",
            messagingSenderId: "20311065718",
            appId: "1:20311065718:web:5e50f0ad492d57f2518b57"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const adminPasswordCheck = prompt("تنبيه أمني: برجاء إدخال كلمة سر الأدمن للدخول إلى لوحة التحكم:");
        if (adminPasswordCheck !== "15935700") {
            alert("عذراً، كلمة السر خاطئة!"); window.location.href = "index.html"; 
        } else { localStorage.setItem("loggedInUser", "Zero"); }

        function loadAdminData() {
            if (localStorage.getItem("loggedInUser") !== "Zero") return;
            db.collection("game").doc("current_puzzle").get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById("storyTitle").value = data.title || "";
                    document.getElementById("storyAuthor").value = data.author || "";
                    document.getElementById("storyBody").value = data.story || "";
                    document.getElementById("storyPassword").value = data.password || "";
                    document.getElementById("storyHint").value = data.hint || "";
                }
            });
            db.collection("game").doc("settings").get().then((doc) => {
                if (doc.exists) document.getElementById("contactUrl").value = doc.data().contactUrl || "";
            });
            
            // جلب الحسابات وعرض الباسورد والنقاط
            db.collection("users").orderBy("points", "desc").onSnapshot((querySnapshot) => {
                const tbody = document.getElementById("adminUsersRows"); tbody.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    if(doc.id !== "Zero") {
                        const userData = doc.data();
                        tbody.innerHTML += `<tr>
                            <td style="color:#ffc107; font-weight:bold;">${doc.id}</td>
                            <td><input type="number" value="${userData.points || 0}" class="table-input" id="points_${doc.id}"></td>
                            <td><input type="text" value="${userData.password || ''}" class="table-input" style="max-width:100px;" id="pass_${doc.id}"></td>
                            <td>
                                <button class="btn" style="padding:4px 8px; width:auto; font-size:12px; margin-bottom:2px;" onclick="updateUserData('${doc.id}')">حفظ</button>
                                <button class="btn btn-danger" style="padding:4px 8px; width:auto; font-size:12px;" onclick="deleteUser('${doc.id}')">حذف</button>
                            </td>
                        </tr>`;
                    }
                });
            });
            
            db.collection("suggestions").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
                const container = document.getElementById("suggestionsContainer"); container.innerHTML = "";
                if (querySnapshot.empty) { container.innerHTML = '<p style="color: #888;">لا توجد اقتراحات جديدة حالياً.</p>'; return; }
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `<div class="suggestion-item">
                        <p><strong>اسم الفائز:</strong> ${data.author}</p>
                        <p><strong>القصة المقترحة:</strong> ${data.story}</p>
                        <p><strong>كلمة السر المقترحة:</strong> ${data.password}</p>
                        <div style="margin-top:10px; display:flex; gap:10px;">
                            <button class="btn" style="background:#44bb44; font-size:13px; padding:6px; width:auto;" onclick="acceptSuggestion('${doc.id}', '${data.story}', '${data.password}', '${data.author}')">اعتماد ونشر القصة</button>
                            <button class="btn btn-danger" style="font-size:13px; padding:6px; width:auto;" onclick="deleteSuggestion('${doc.id}')">حذف الاقتراح</button>
                        </div>
                    </div>`;
                });
            });
        }

        function updatePuzzle() {
            db.collection("game").doc("current_puzzle").set({
                title: document.getElementById("storyTitle").value.trim(),
                author: document.getElementById("storyAuthor").value.trim(),
                story: document.getElementById("storyBody").value.trim(),
                password: document.getElementById("storyPassword").value.trim(),
                hint: document.getElementById("storyHint").value.trim(),
                isSolved: false, winner: ""
            }).then(() => { alert("تم نشر القصة واللغز الجديد بنجاح أونلاين!"); });
        }
        function updateContact() {
            db.collection("game").doc("settings").set({ contactUrl: document.getElementById("contactUrl").value.trim() }).then(() => { alert("تم تحديث الرابط!"); });
        }
        
        // دالة تحديث النقاط والباسورد معاً
        function updateUserData(username) {
            const newPoints = parseInt(document.getElementById("points_" + username).value);
            const newPass = document.getElementById("pass_" + username).value.trim();
            
            if(newPass === "") { alert("لا يمكن ترك كلمة المرور فارغة!"); return; }
            
            db.collection("users").doc(username).update({
                points: newPoints,
                password: newPass
            }).then(() => { alert("تم تحديث بيانات اللاعب " + username + " بنجاح!"); });
        }
        
        function deleteUser(username) {
            if (confirm("هل أنت متأكد من حذف حساب اللاعب " + username + " تماماً؟")) db.collection("users").doc(username).delete();
        }
        function deleteSuggestion(id) {
            if (confirm("حذف الاقتراح؟")) db.collection("suggestions").doc(id).delete();
        }
        function acceptSuggestion(id, story, password, author) {
            document.getElementById("storyTitle").value = "قصة اليوم من الفائز";
            document.getElementById("storyAuthor").value = author;
            document.getElementById("storyBody").value = story;
            document.getElementById("storyPassword").value = password;
            document.getElementById("storyHint").value = "";
            updatePuzzle(); db.collection("suggestions").doc(id).delete();
        }
        window.onload = loadAdminData;
    </script>
</body>
</html>
