<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال القصص</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f12; color: #fff; padding: 20px; }
        .main-container { max-width: 800px; margin: 0 auto; background: #16161a; padding: 30px; border-radius: 16px; border: 1px solid #222227; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #1a1a1f; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; text-align: center; border: 1px solid #00adb5; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #222227; border: 1px solid #333; color: white; border-radius: 5px; }
        button { background: #00adb5; border: none; padding: 12px 25px; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-container">
    <h2 id="storyTitle">جاري تحميل اللغز...</h2>
    <div id="storyBox" style="margin: 20px 0; min-height: 150px; color: #ff3333; font-weight: bold;"></div>
    <input type="text" id="playerAnswer" placeholder="اكتب كلمة السر هنا">
    <button onclick="checkAnswer()">إرسال الحل</button>
</div>

<div id="messageModal" class="modal">
    <div class="modal-content">
        <p id="modalText"></p>
        <button onclick="document.getElementById('messageModal').style.display='none'">حسناً</button>
    </div>
</div>

<div id="winModal" class="modal">
    <div class="modal-content">
        <h3>🥳 مبروك! اكتب قصتك الجديدة</h3>
        <textarea id="newStory" placeholder="اكتب قصتك هنا"></textarea>
        <input type="text" id="newPassword" placeholder="كلمة السر للقصة">
        <input type="text" id="newHint" placeholder="تلميح للقصة">
        <button onclick="submitNewStory()">إرسال القصة</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDCYnbAcV0HtrSyRUorBQmXQuBJO7m1C4A",
        authDomain: "zerobaba-7733e.firebaseapp.com",
        projectId: "zerobaba-7733e",
        storageBucket: "zerobaba-7733e.firebasestorage.app",
        messagingSenderId: "20311065718",
        appId: "1:20311065718:web:5e50f0ad492d57f2518b57"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // حماية الدخول
    if (!sessionStorage.getItem("loggedInUser")) window.location.href = "index.html";

    function checkAnswer() {
        let input = document.getElementById('playerAnswer').value;
        db.collection("game").doc("current_puzzle").get().then(doc => {
            let data = doc.data();
            if (input === data.password && !data.isSolved) {
                document.getElementById('winModal').style.display = 'flex';
            } else if (data.isSolved) {
                document.getElementById('modalText').innerText = "للأسف كان غيرك أشطر!";
                document.getElementById('messageModal').style.display = 'flex';
            } else {
                document.getElementById('modalText').innerText = "كلمة السر خاطئة!";
                document.getElementById('messageModal').style.display = 'flex';
            }
        });
    }

    function submitNewStory() {
        let s = document.getElementById('newStory').value;
        let p = document.getElementById('newPassword').value;
        let h = document.getElementById('newHint').value;
        db.collection("suggestions").add({author: sessionStorage.getItem("loggedInUser"), story: s, password: p, hint: h}).then(() => {
            document.getElementById('winModal').style.display = 'none';
            document.getElementById('modalText').innerText = "تم إرسال قصتك للأدمن!";
            document.getElementById('messageModal').style.display = 'flex';
        });
    }
</script>
</body>
</html>
