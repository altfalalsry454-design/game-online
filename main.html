<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال القصص</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f12; color: #ffffff; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 15px 25px; background: #16161a; border-radius: 12px; border: 1px solid #222227; }
        .header-title { font-size: 26px; font-weight: 800; color: #ffffff; }
        .btn-top-100 { background: linear-gradient(135deg, #0052cc, #003d99); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        .main-container { max-width: 850px; width: 100%; margin: 0 auto; background-color: #16161a; padding: 30px; border-radius: 16px; border: 1px solid #222227; }
        .story-main-title { font-size: 24px; font-weight: bold; color: #00adb5; margin-bottom: 10px; }
        .story-box { width: 100%; height: 300px; background-color: #1a1a1f; border: 1px solid #2d2d35; border-radius: 12px; padding: 25px; color: #ff3333; font-size: 20px; font-weight: bold; line-height: 1.8; overflow-y: auto; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        .answer-section { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .input-wrapper { flex: 2; }
        input, textarea { width: 100%; padding: 14px; background-color: #1a1a1f; border: 1px solid #2d2d35; border-radius: 8px; color: white; text-align: center; }
        .btn-submit { background: #00adb5; color: white; border: none; padding: 14px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background-color: #16161a; padding: 30px; border-radius: 16px; max-width: 500px; width: 100%; border: 1px solid #00adb5; text-align: center; }
        .close-btn { background-color: #ff4444; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <header>
        <div class="header-title">أبطال القصص</div>
        <button class="btn-top-100" onclick="openLeaderboard()">أبطال القصة</button>
    </header>

    <div class="main-container">
        <div class="story-main-title" id="storyTitleType">جاري التحميل...</div>
        <div class="story-box" id="currentStory">جاري تحميل قصة اليوم...</div>
        <div class="answer-section">
            <div class="input-wrapper"><input type="text" id="playerAnswer" placeholder="اكتب كلمة السر هنا"></div>
            <div id="currentHint" style="color: #ffc107; font-size: 14px;">التلميح: ---</div>
            <button class="btn-submit" onclick="checkAnswer()">إرسال الحل</button>
        </div>
    </div>

    <div class="modal" id="messageModal"><div class="modal-content"><p id="messageText"></p><button class="close-btn" onclick="document.getElementById('messageModal').style.display='none'">حسناً</button></div></div>
    <div class="modal" id="leaderboardModal"><div class="modal-content"><h3 style="color:#ffc107">🏆 أفضل اللاعبين</h3><table id="leaderboardRows" style="width:100%; color:white; margin:15px 0;"></table><button class="close-btn" onclick="closeLeaderboard()">إغلاق</button></div></div>

    <script>
        const firebaseConfig = { /* أضف بياناتك هنا */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentPlayerName = sessionStorage.getItem("loggedInUser");
        if (!currentPlayerName) window.location.href = "index.html";

        // المستمع اللحظي (هو مفتاح الحل ليظهر ما ينشره الأدمن فوراً)
        db.collection("game").doc("current_puzzle").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById("storyTitleType").innerText = data.title;
                document.getElementById("currentStory").innerText = data.story;
                document.getElementById("currentHint").innerText = "التلميح: " + data.hint;
            }
        });

        function checkAnswer() {
            const playerInput = document.getElementById("playerAnswer").value.trim();
            db.collection("game").doc("current_puzzle").get().then((doc) => {
                const data = doc.data();
                if (playerInput === data.password) {
                    if (!data.isSolved) {
                        db.collection("game").doc("current_puzzle").update({ isSolved: true, winner: currentPlayerName });
                        alert("مبروك! أنت الفائز!");
                    } else { alert("للأسف، القصة حُلت مسبقاً."); }
                } else { alert("كلمة السر خاطئة!"); }
            });
        }
        
        function openLeaderboard() { document.getElementById("leaderboardModal").style.display = "flex"; }
        function closeLeaderboard() { document.getElementById("leaderboardModal").style.display = "none"; }
    </script>
</body>
</html>
